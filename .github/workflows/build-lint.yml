name: build-lint

on:
  push:
    branches:
      - "master"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - "*"
    paths:
      - "!**"
      - "Dockerfile"
      - "docker-bake.hcl"
      - "tools/**/**"
      - "scripts/**/**"
      - ".github/**/**"
      - "Makefile"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-dockerfiles:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dockerfile:
          [
            "Dockerfile",
          ]
    runs-on: "ubuntu-24.04"
    name: Lint ${{ matrix.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        uses: jbergstroem/hadolint-gh-action@v1.15.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          annotate: true
          error_level: 2

  check-release-config:
    runs-on: 'ubuntu-24.04'
    name: Check releaser configs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true

      - name: Check release
        run: |
          make check-releaser
        shell: bash

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          # The runner is thrown away anyway; removing the builder takes about a minute.
          cleanup: false

      # Only master pushes refresh the layer cache; PRs just read it.
      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build Docker image
        uses: docker/bake-action@v7.5.0
        env:
          TAGS: ${{ steps.meta.outputs.bake-file-tags }}
          LABELS: ${{ steps.meta.outputs.bake-file-labels }}
          ANNOTATIONS: ${{ steps.meta.outputs.bake-file-annotations }}
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ env.TAGS }}
            cwd://${{ env.LABELS }}
            cwd://${{ env.ANNOTATIONS }}
          targets: gotools-latest
          set: |
            *.platform=${{ matrix.platform }}
            ${{ github.event_name == 'push' && format('*.cache-to=type=registry,ref={0}/{1}:buildcache-{2},mode=max', env.REGISTRY, env.IMAGE_NAME, env.PLATFORM_PAIR) || '' }}
          push: false
          pull: true
